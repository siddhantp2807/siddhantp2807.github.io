    Experience:
      - company: Indian Institute of Technology, Roorkee
        position: Project Assistant, Hazra Lab
        start_date: 2026-07
        end_date:
        highlights:
          - 'NeurIPS AMP Challenge submission: Implemented a generative design and ranking pipeline (VAE with conditional latent diffusion and a censoring-aware MIC ranker) for broad-spectrum antimicrobial peptides trained on a harmonized MIC dataset with CD-HIT homology-aware splits. <a href="https://github.com/siddhantp2807/amp-challenge-2027" target="_blank">Link to repository</a>'
          - 'AMP/non-AMP classifier: Trained an XGBoost classifier on ProtBERT embeddings (reduced using PCA, with collinear biophysical features removed) using homology-aware splitting, reaching a test MCC of 0.87 on a 156-peptide dataset. <a href="https://github.com/rikmicrobio/IIMT-WORKSHOP-" target="_blank">Link to repository</a>'

      - company: Ashoka University
        position: Project Research Scientist I, Augmented Health Systems Lab
        start_date: 2026-01
        end_date: 2026-07
        highlights:
          - Deployed a custom data workflow to harmonize over 40 highly unstructured clinical, socio-economic, and lab-based IVF-EHR data fields via rule-based extraction and manual curation
          - Developed an automated rule-based labeling and classification pipeline using 15+ lab parameters and EHR fields (Chief complaint, Past medical history, Family history, Current medication) to segment patients into clinical cohorts

      - company: Koita Centre of Digital Health - Ashoka University
        position: Machine Learning Engineer, Augmented Health Systems Lab
        start_date: 2025-08
        end_date: 2025-12
        highlights:
          - Built pipelines for docking and containerized deep learning models (DynamicBind, FlowDock, DiffDock) for Protein-Ligand docking and binding affinity prediction to identify candidate small-molecule inhibitors of the NS3 serine protease.
          - Deployed LLM-augmented pipelines for clinical term extraction from over 70,000 unstructured clinical prescription notes.
          - Implemented a semi-automated data pipeline to standardize unstructured EHR records (Chief complaint, Past medical history, Family history, Current medication) using OHDSI standardized vocabularies
          - Worked with subject matter expert to develop a pipeline for Somatic Variant Calling with tumor-only and paired tumor-normal mode on 15 samples

      - company: Koita Centre of Digital Health - Ashoka University
        position: Junior Machine Learning Engineer, Augmented Health Systems Lab
        start_date: 2024-07
        end_date: 2025-07
        highlights:
          - Designed and implemented web-scraping pipelines to scrape Indian medication data (both prescription and over-the-counter drugs) from popular e-pharma websites
          - Built a (semi-automated) workflow to map Indian medication data to OMOP at the Active Pharmaceutical Ingredient (API) Level.
          - Used the now-interoperable Indian medication data to find gaps in Drug Codes at the national level (NRCeS CDCI). Also linked the standardized medication data to global databases such as PubChem and DrugBank.

